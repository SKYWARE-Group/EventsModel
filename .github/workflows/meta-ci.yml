name: Test EventsModel.Meta

on:
  push:
    branches: [dev, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
      - name: Test all supported frameworks
        run: dotnet test tests/EventsModel.Meta.Tests/EventsModel.Meta.Tests.csproj -c Release -p:GeneratePackageOnBuild=false
      - name: Verify package
        run: dotnet pack src/EventsModel.Meta/EventsModel.Meta.csproj -c Release --no-build -p:GeneratePackageOnBuild=false -o artifacts
